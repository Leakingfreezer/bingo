<!DOCTYPE html>
<html>
  <head>
    <title>Advocacy Bingo</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="game-wrapper">
      <!--Photo-->
      <img src = "bingo_bg.png" class = "background" />

      <!--Buttons-->
      <button class="generate-term">Draw Term</button>
      <button class="reveal-all">Reveal All</button>

      <!--Term generator-->
      <div class="term-box">Term...</div>

      <!--Cards/grid-->
      <div class = "grid-container">
        <button class="card">Policy</button>
        <button class="card">Safeguarding</button>
        <button class="card">National Strategy</button>
        <button class="card">Government</button>
        <button class="card">Program</button>
        <button class="card">Rights-Based</button>
        <button class="card">NGO</button>
        <button class="card">Academia</button>
        <button class="card">Private Sector</button>
        <button class="card">Recommendations</button>
        <button class="card">Self-Care</button>
        <button class="card">Safety</button>
        <button class="card">Ethical</button>
        <button class="card">Meaningful Child Participation</button>
        <button class="card">Sustainability</button>
        <button class="card">Intergenerational Partnership/Collaboration</button>
      </div>
    </div>
  </body>

</html>
